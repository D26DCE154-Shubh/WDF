<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>StudentHub | Login</title>
</head>

<body>
    <header class="site-header">

        <div class="nav-container">

            <a href="index.html" class="brand">
                <img src="../images/logo.png" alt="StudentHub Logo" class="brand-logo">
                <span class="brand-name">StudentHub</span>
            </a>

            <nav class="main-navigation" aria-label="Main Navigation">

                <ul class="nav-list">

                    <li>
                        <a href="index.html" class="nav-link">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html" class="nav-link">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="academics.html" class="nav-link">
                            Academics
                        </a>
                    </li>

                    <li>
                        <a href="attendance.html" class="nav-link">
                            Attendance
                        </a>
                    </li>

                    <li>
                        <a href="communication.html" class="nav-link">
                            Communication
                        </a>
                    </li>

                    <li>
                        <a href="contact.html" class="nav-link">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

            <div class="nav-actions">

                <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode"
                    title="Switch to dark mode">
                    🌙
                </button>

                <a href="login.html" class="nav-login">
                    Login
                </a>

                <a href="register.html" class="nav-register">
                    Register
                </a>

            </div>


        </div>

    </header>

    <main>
        <section class="registration-section">
            <h2>Sign In</h2>
            <p>Login to access your StudentHub account.</p>

            <form id="login-form" action="#" novalidate>

                <!-- Username / Email -->
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" placeholder="Enter username or email"
                        autocomplete="username" aria-describedby="username-error" required>
                    <small id="username-error" class="error-message"></small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" minlength="6" aria-describedby="login-password-error" required>
                    <small id="login-password-error" class="error-message"></small>
                </div>

                <!-- Remember Me -->
                <div class="terms-group">
                    <label>
                        <input type="checkbox" id="remember" name="remember">
                        Remember me
                    </label>
                </div>

                <!-- Success Message -->
                <div id="login-success" class="success-message" role="status" aria-live="polite"></div>

                <button type="submit">Login</button>

            </form>

            <p>
                New here?
                <a href="register.html">Create an account</a>.
            </p>
        </section>
    </main>

    <footer>
        <p>Forgot your password? <a href="#">Reset it here</a>.</p>
    </footer>

    <script src="../js/script.js"></script>

</body>

</html>
